on:
  - push

defaults:
  run:
    shell: "sh -e {0}"

jobs:
  salt-lint:
    runs-on: codeberg-tiny
    # alpine:edge (20260805)
    container: alpine@sha256:020dfcbaaf4cc1078bf2d9c7ba31a8466e334061dcd2f248001d68f79e52c000
    name: salt-lint
    steps:

      - name: prep container
        run: |
          apk update
          apk add \
            bash=5.3.9-r2 \
            git=2.56.0-r0 \
            nodejs=24.22.1-r0

      # https://code.forgejo.org/actions/checkout/src/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - run: ./ci/salt-lint.sh

  shellcheck:
    runs-on: codeberg-tiny
    # alpine:edge (20260805)
    container: alpine@sha256:020dfcbaaf4cc1078bf2d9c7ba31a8466e334061dcd2f248001d68f79e52c000
    name: shellcheck
    steps:

      - name: install shellcheck
        run: |
          apk update
          apk add
            bash=5.3.9-r2 \
            git=2.56.0-r0 \
            nodejs=24.22.1-r0 \
            shellcheck=0.11.0-r2

      - name: checkout
        # https://code.forgejo.org/actions/checkout/src/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true

      - name: run shellcheck script
        run: |
          ./ci/shellcheck.sh "$(pwd)"

